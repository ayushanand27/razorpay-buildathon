name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend test suite (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install dependencies
        # Installs from a fully hash-locked file (direct + transitive
        # deps, exact versions, sha256 digest per file -- see
        # requirements-lock.txt and generate_lock_hashes.py) instead of
        # the looser requirements.txt. --require-hashes refuses to
        # install anything whose downloaded bytes don't match a listed
        # digest -- a compromised registry serving different content
        # under the same version number is caught, not just an
        # unpinned version. --only-binary :all: additionally refuses to
        # build any package from source (sdist), which would otherwise
        # let an arbitrary setup.py/build-backend run code during
        # install -- every pin here has a published wheel already.
        run: 'pip install --require-hashes --only-binary :all: -r requirements-lock.txt'

      - name: Run test suite
        run: python -m pytest -v
