<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Merchant Chat — Human Buyer Demo</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#e5ddd5; margin:0; }
  .phone { max-width: 420px; margin: 20px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.2); }
  .header { background:#075e54; color:#fff; padding:14px 16px; font-weight:600; }
  .header small { display:block; font-weight:400; opacity:.8; font-size:12px; }
  #log { height: 480px; overflow-y:auto; padding:12px; background:#e5ddd5; }
  .msg { max-width:75%; padding:8px 12px; border-radius:8px; margin:6px 0; font-size:14px; line-height:1.4; white-space:pre-wrap; }
  .bot { background:#fff; margin-right:auto; }
  .user { background:#dcf8c6; margin-left:auto; }
  .sys { background:#fff3cd; margin:6px auto; text-align:center; font-size:12px; color:#856404; max-width:90%; }
  .msg a { color:#075e54; font-weight:600; word-break:break-all; }
  .pay-link { display:inline-block; margin-top:4px; background:#25d366; color:#fff !important; text-decoration:none;
              padding:8px 16px; border-radius:20px; font-weight:600; word-break:normal; }
  .pay-link:hover { background:#1fb855; }
  .add-btn { background:none; border:1px solid #128c7e; color:#128c7e; border-radius:14px; padding:3px 10px;
             font-size:12px; cursor:pointer; margin-top:2px; }
  .add-btn:hover { background:#128c7e; color:#fff; }
  .add-btn:disabled { border-color:#ccc; color:#aaa; cursor:not-allowed; }
  .typing { display:inline-flex; gap:3px; align-items:center; }
  .typing span { width:6px; height:6px; border-radius:50%; background:#999; animation: typing-bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:.2s; }
  .typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes typing-bounce { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-4px); opacity:1; } }
  .quick button:disabled, #sendBtn:disabled { opacity:.5; cursor:not-allowed; }
  #inputRow { display:flex; border-top:1px solid #ddd; }
  #inputBox { flex:1; padding:12px; border:none; outline:none; font-size:14px; }
  #sendBtn { background:#075e54; color:#fff; border:none; padding:0 20px; cursor:pointer; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px; }
  .quick button { background:#128c7e; color:#fff; border:none; border-radius:14px; padding:6px 12px; font-size:12px; cursor:pointer; }
  .product-card { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .product-thumb { width:40px; height:40px; border-radius:8px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:18px; color:#fff; }
  .product-info { font-size:13px; line-height:1.3; }
  .product-info .name { font-weight:600; }
  .out-of-stock { color:#c0392b; font-weight:600; }
  .nav { display:flex; gap:20px; align-items:center; padding:14px 24px; background:#1f2430; color:#fff; font-family:-apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .nav a { color:#cfd3dc; text-decoration:none; font-size:14px; font-weight:500; }
  .nav a.active { color:#fff; border-bottom:2px solid #6a5cff; padding-bottom:3px; }
  .nav a:hover { color:#fff; }
</style>
</head>
<body>
<div class="nav">
  <a href="catalog.html">Catalog</a>
  <a href="index.html" class="active">Chat</a>
  <a href="audit-dashboard.html">Audit Trail</a>
  <a href="metrics.html">Metrics</a>
</div>
<div class="phone">
  <div class="header">Demo Merchant Store <small>simulated WhatsApp checkout — human buyer flow</small></div>
  <div id="log"></div>
  <div class="quick">
    <button onclick="send('catalog')">Show catalog</button>
    <button onclick="send('cart')">View cart</button>
    <button onclick="send('checkout')">Checkout</button>
    <button onclick="send('fail demo')">Trigger failure demo</button>
  </div>
  <div id="inputRow">
    <input id="inputBox" placeholder="Type a message..." aria-label="Chat message" autofocus onkeydown="if(event.key==='Enter')send()"/>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
const BACKEND = "http://127.0.0.1:8123";
// The backend no longer accepts a client-chosen session id or actor --
// a session is established via POST /session/human on load (see init()
// below), which is the server-side source of truth for "who is this
// buyer" (see backend/app/sessions.py).
let SESSION_ID = null;

function newIdempotencyKey() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  if (window.crypto && crypto.getRandomValues) {
    // A real CSPRNG, just not the randomUUID() convenience wrapper --
    // supported far further back than randomUUID() itself.
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  }
  // Last-resort fallback for a browser with no Web Crypto API at all --
  // an idempotency key only needs practical uniqueness (never security
  // unpredictability), but Math.random() is avoided whenever any real
  // CSPRNG source is available.
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function log(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  document.getElementById('log').appendChild(el);
  document.getElementById('log').scrollTop = 1e9;
}

function sys(text) { log(text, 'sys'); }
function bot(text) { log(text, 'bot'); }

function botHTML(html) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = html;
  document.getElementById('log').appendChild(el);
  document.getElementById('log').scrollTop = 1e9;
  return el;
}

function showTyping() {
  return botHTML('<span class="typing"><span></span><span></span><span></span></span>');
}

// Disables input while a request is in flight -- without this, rapidly
// double-clicking "Checkout" (or any quick-action button) fires two
// overlapping requests; the backend's idempotency handling absorbs
// that safely, but the UI shouldn't invite it in the first place.
function setBusy(busy) {
  document.getElementById('inputBox').disabled = busy;
  document.getElementById('sendBtn').disabled = busy;
  document.querySelectorAll('.quick button').forEach(b => b.disabled = busy);
}

async function api(path, opts) {
  try {
    const res = await fetch(BACKEND + path, opts);
    return res.json();
  } catch (err) {
    return { detail: "Could not reach the backend at " + BACKEND };
  }
}

// No real product photos in this demo -- colored placeholder thumbs keyed
// by category so the catalog still reads as a real storefront.
const CATEGORY_THUMB = {
  electronics: { color: '#4a90d9', icon: '⚡' },
  apparel:     { color: '#e07b39', icon: '👕' },
  home:        { color: '#43a047', icon: '🏠' },
  stationery:  { color: '#8e44ad', icon: '📓' },
};

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function showCatalog() {
  const data = await api('/catalog');
  if (data.detail) { bot(data.detail); return; }
  let html = "Here's what we have:<br>";
  data.products.forEach(p => {
    const thumb = CATEGORY_THUMB[p.category] || { color: '#999', icon: '🛒' };
    const oos = p.stock === 0;
    const stockLine = oos
      ? '<span class="out-of-stock">OUT OF STOCK</span>'
      : `Rs.${p.price_inr} &nbsp; <button class="add-btn" onclick="this.disabled=true;addItem('${p.id}')">+ Add</button>`;
    html += `<div class="product-card"><div class="product-thumb" style="background:${thumb.color}">${thumb.icon}</div><div class="product-info"><div class="name">${escapeHTML(p.id)} — ${escapeHTML(p.name)}</div><div>${stockLine}</div></div></div>`;
  });
  html += "<br>Or just type: add sku_001";
  botHTML(html);
}

async function addItem(sku) {
  const data = await api('/cart/add', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: SESSION_ID, product_id: sku, qty: 1})
  });
  if (data.detail) { bot("Couldn't add that: " + data.detail); return; }
  bot(`Added! Cart total: Rs.${data.total_inr}`);
  if (data.upsell) {
    const u = data.upsell;
    botHTML(`💡 ${escapeHTML(u.name)} — Rs.${u.price_inr}<br>${escapeHTML(u.reason)}<br>` +
            `<button class="add-btn" onclick="this.disabled=true;addItem('${u.product_id}')">+ Add ${escapeHTML(u.product_id)}</button>`);
  }
}

async function showCart() {
  const data = await api('/cart/' + SESSION_ID);
  if (data.detail) { bot(data.detail); return; }
  if (!data.cart.length) { bot("Your cart is empty."); return; }
  let txt = "Your cart:\n";
  data.cart.forEach(l => txt += `${l.name} x${l.qty} — Rs.${l.qty*l.price_inr}\n`);
  txt += `\nTotal: Rs.${data.total_inr}`;
  bot(txt);
}

async function doCheckout(simulateFailure=false) {
  sys("[audit] checkout_attempt logged");
  const data = await api('/checkout', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: SESSION_ID, idempotency_key: newIdempotencyKey(), simulate_failure: simulateFailure})
  });
  if (data.detail) { bot("Checkout failed: " + data.detail); sys("[audit] failure logged"); return; }
  if (data.note && data.note.includes('recovered')) {
    sys("[audit] first attempt failed, agent retried automatically — recovered");
  }
  botHTML(`All set! Amount: Rs.${data.amount_inr}<br>` +
          `<a class="pay-link" href="${escapeHTML(data.payment_link)}" target="_blank" rel="noopener noreferrer">Pay now →</a>`);
  sys("[audit] checkout_payment logged");
}

// Free-text fallback: anything that isn't one of the hardcoded
// commands above goes to the backend's Groq-powered intent classifier
// (POST /nlu/turn). It only ever picks a tool name (browse / add /
// view_cart / checkout / clarify) -- the backend executes that tool
// through the exact same cart/checkout functions the hardcoded
// commands call, so every guardrail still applies. 3s timeout, then
// the same fixed fallback hint the backend itself falls back to.
async function handleFreeText(text) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);
  try {
    const res = await fetch(BACKEND + '/nlu/turn', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: SESSION_ID, text}),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    const data = await res.json();
    bot(data.reply || "Try 'catalog', 'add sku_001', 'cart', or 'checkout'.");
  } catch (err) {
    clearTimeout(timeoutId);
    bot("Try 'catalog', 'add sku_001', 'cart', or 'checkout'.");
  }
}

async function send(preset) {
  const box = document.getElementById('inputBox');
  const text = preset || box.value.trim();
  if (!text) return;
  if (!SESSION_ID) { bot("Still connecting to the store, one moment..."); return; }
  log(text, 'user');
  box.value = '';

  setBusy(true);
  const typingEl = showTyping();
  try {
    // Exact command shortcuts stay first and unchanged -- deterministic,
    // no network round-trip, reliable for the recorded demo.
    if (text === 'catalog') return await showCatalog();
    if (text === 'cart') return await showCart();
    if (text === 'checkout') return await doCheckout(false);
    if (text === 'fail demo') return await doCheckout(true);
    if (text.startsWith('add ')) return await addItem(text.split(' ')[1].trim());

    return await handleFreeText(text);
  } finally {
    typingEl.remove();
    setBusy(false);
    box.focus();
  }
}

async function init() {
  // Establishes a server-side session (see backend/app/sessions.py) --
  // the backend no longer accepts a client-chosen session id or a
  // client-claimed actor.
  const sessionData = await api('/session/human', {method: 'POST'});
  if (sessionData.detail || !sessionData.session_id) {
    bot(sessionData.detail || "Could not start a session with the backend.");
    return;
  }
  SESSION_ID = sessionData.session_id;

  bot("Hi! Welcome to Demo Merchant Store 👋\nType 'catalog' to see products.");

  // Clicking "Buy" on catalog.html links here as index.html?buy=sku_001
  // -- land straight in the purchase flow instead of an empty chat.
  const buySku = new URLSearchParams(window.location.search).get('buy');
  if (buySku) {
    send('add ' + buySku);
  }
}
init();
</script>
</body>
</html>
